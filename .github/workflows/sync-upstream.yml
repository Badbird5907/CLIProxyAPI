name: Sync upstream

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Badbird5907/CLIProxyAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream without discarding fork changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.merge.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Test merged tree
        if: steps.merge.outputs.changed == 'true'
        run: go test ./...
      - name: Build merged tree
        if: steps.merge.outputs.changed == 'true'
        run: go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server
      - name: Push verified merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
